forms:
  - operation_id: search_messages
    title: "Search IMAP messages"
    fields:
      - {name: mailbox, widget_type: text, label: Mailbox, required: true, help_text: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX.", placeholder: "INBOX"}
      - {name: filters, widget_type: json, label: Filters, help_text: "JSON object using from, to, cc, subject, text, message_id, since/before (YYYY-MM-DD), unseen/seen, flagged/unflagged, has_attachments or uid_gte/uid_lte. Do not combine opposing true flags.", placeholder: "{\"subject\":\"invoice\",\"unseen\":true}"}
      - {name: limit, widget_type: number, label: Limit, help_text: "Maximum number of results to return in this page."}
      - {name: cursor, widget_type: text, label: Cursor, help_text: "Leave empty for the first page. For later pages, map next_cursor returned by this search and keep the same connection, filters and page size."}
  - operation_id: get_message
    title: "Read IMAP message"
    fields:
      - {name: mailbox, widget_type: text, label: Mailbox, required: true, help_text: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX.", placeholder: "INBOX"}
      - {name: uid, widget_type: number, label: UID, required: true, help_text: "Positive numeric IMAP UID returned by Search IMAP messages, from the same mailbox."}
      - {name: include_body, widget_type: boolean, label: Include body, help_text: "Include the message body in the result for downstream text processing."}
      - {name: include_headers, widget_type: boolean, label: Include headers, help_text: "Include the message headers in the result."}
      - {name: include_attachment_metadata, widget_type: boolean, label: Include attachment metadata, help_text: "Include attachment identifiers, filenames and content types so a later download step can select a file."}
      - {name: include_raw_html, widget_type: boolean, label: Include raw HTML, help_text: "Include the original HTML body when HTML content is needed by a later step."}
  - operation_id: get_attachment
    title: "Download IMAP attachment"
    fields:
      - {name: mailbox, widget_type: text, label: Mailbox, required: true, help_text: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX.", placeholder: "INBOX"}
      - {name: uid, widget_type: number, label: UID, required: true, help_text: "Positive numeric IMAP UID returned by Search IMAP messages, from the same mailbox."}
      - {name: attachment_id, widget_type: text, label: Attachment ID, required: true, help_text: "Attachment identifier from Read IMAP message. At runtime, supply exactly one of attachment_id, filename or content_type."}
  - operation_id: set_message_flags
    title: "Set IMAP read and starred flags"
    fields:
      - {name: mailbox, widget_type: text, label: Mailbox, required: true, help_text: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX.", placeholder: "INBOX"}
      - {name: uids, widget_type: json, label: UIDs, required: true, help_text: "JSON array of positive IMAP UIDs from the selected source mailbox.", placeholder: "[123, 124]"}
      - {name: seen, widget_type: boolean, label: Seen, help_text: "Set true to mark messages read or false to mark them unread. Leave empty to preserve read state; provide at least one of seen or flagged."}
      - {name: flagged, widget_type: boolean, label: Flagged, help_text: "Set true to star messages or false to remove the star. Leave empty to preserve starred state; provide at least one of seen or flagged."}
  - operation_id: move_messages
    title: "Move IMAP messages"
    fields:
      - {name: source_mailbox, widget_type: text, label: Source mailbox, required: true, help_text: "Existing mailbox containing the selected UIDs. UIDs are scoped to this mailbox.", placeholder: "INBOX"}
      - {name: target_mailbox, widget_type: text, label: Target mailbox, required: true, help_text: "Existing destination mailbox name returned by List IMAP mailboxes.", placeholder: "Processed"}
      - {name: uids, widget_type: json, label: UIDs, required: true, help_text: "JSON array of positive IMAP UIDs from the selected source mailbox.", placeholder: "[123, 124]"}
  - operation_id: delete_messages
    title: "Delete or trash IMAP messages"
    fields:
      - {name: mailbox, widget_type: text, label: Mailbox, required: true, help_text: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX.", placeholder: "INBOX"}
      - {name: uids, widget_type: json, label: UIDs, required: true, help_text: "JSON array of positive IMAP UIDs from the selected source mailbox.", placeholder: "[123, 124]"}
      - {name: mode, widget_type: select, label: Mode, help_text: "move_to_trash moves messages to the connection's trash folder. permanent deletes them and also requires confirm_permanent_delete=true."}
      - {name: confirm_permanent_delete, widget_type: boolean, label: Confirm permanent deletion, help_text: "Enable only with mode=permanent to confirm removal of the selected messages."}
  - operation_id: discover_settings
    title: Inspect IMAP connection settings
    fields: []
  - operation_id: test_connection
    title: Test IMAP connection
    fields: []
  - operation_id: list_mailboxes
    title: List IMAP mailboxes
    fields: []
