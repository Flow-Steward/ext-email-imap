operations:
  - operation_id: discover_settings
    display_name: "Inspect IMAP connection settings"
    description: "Inspect saved connection settings and return confirmed or manual provider guidance. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Inspect the saved host and TLS settings while configuring a new mailbox."
    operation_kind: source
    category: email
    connection_type_ids: [imap_mailbox]
    inputs: [{name: connection_ref, value_type: connection_ref, required: true}]
    outputs: [{name: settings, value_type: object}]
    result_fields: [result.settings]
    error_codes: [invalid_payload, invalid_connection, unsupported_provider, imap_command_failed, internal_error]
  - operation_id: test_connection
    display_name: "Test IMAP connection"
    description: "Authenticate to the selected IMAP mailbox and report supported capabilities. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Check authentication and MOVE support before building mailbox triage."
    operation_kind: source
    category: email
    connection_type_ids: [imap_mailbox]
    inputs: [{name: connection_ref, value_type: connection_ref, required: true}]
    outputs:
      - {name: capabilities, value_type: array}
      - {name: supports_idle, value_type: boolean}
      - {name: supports_move, value_type: boolean}
      - {name: supports_uidplus, value_type: boolean}
      - {name: supports_condstore, value_type: boolean}
      - {name: supports_qresync, value_type: boolean}
    result_fields:
      - result.capabilities
      - result.supports_idle
      - result.supports_move
      - result.supports_uidplus
      - result.supports_condstore
      - result.supports_qresync
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - imap_command_failed
      - internal_error
  - operation_id: list_mailboxes
    display_name: "List IMAP mailboxes"
    description: "List the selected mailbox account folders without reading message content. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Find the exact Inbox and processed folder names before searching or moving mail."
    operation_kind: source
    category: email
    connection_type_ids: [imap_mailbox]
    inputs: [{name: connection_ref, value_type: connection_ref, required: true}]
    outputs: [{name: mailboxes, value_type: array}]
    result_fields: [result.mailboxes]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_list_too_large
      - response_too_large
      - imap_command_failed
      - internal_error
  - operation_id: search_messages
    display_name: "Search IMAP messages"
    description: "Search a mailbox with typed filters and return a bounded UID-ordered result set. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Find unread invoice messages with filters {\"subject\":\"invoice\",\"unseen\":true} in INBOX."
    operation_kind: source
    category: email
    connection_type_ids: [imap_mailbox]
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - {name: mailbox, value_type: text, required: true, description: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX."}
      - name: filters
        value_type: object
        required: false
        schema:
          type: object
          additionalProperties: false
          properties:
            from: {type: string}
            to: {type: string}
            cc: {type: string}
            subject: {type: string}
            text: {type: string}
            message_id: {type: string}
            since: {type: string, format: date}
            before: {type: string, format: date}
            unseen: {type: boolean}
            seen: {type: boolean}
            flagged: {type: boolean}
            unflagged: {type: boolean}
            has_attachments: {type: boolean}
            uid_gte: {type: integer, minimum: 1}
            uid_lte: {type: integer, minimum: 1}
        description: "JSON object using from, to, cc, subject, text, message_id, since/before (YYYY-MM-DD), unseen/seen, flagged/unflagged, has_attachments or uid_gte/uid_lte. Do not combine opposing true flags."
      - {name: limit, value_type: integer, required: false, description: "Maximum number of results to return in this page."}
      - {name: cursor, value_type: text, required: false, description: "Leave empty for the first page. For later pages, map next_cursor returned by this search and keep the same connection, filters and page size."}
    outputs:
      - {name: messages, value_type: array}
      - {name: next_cursor, value_type: text}
      - {name: truncated, value_type: boolean}
      - {name: uidvalidity, value_type: integer}
    result_fields: [result.messages, result.next_cursor, result.truncated, result.uidvalidity]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_not_found
      - uidvalidity_changed
      - response_too_large
      - imap_command_failed
      - internal_error
  - operation_id: get_message
    display_name: "Read IMAP message"
    description: "Read one message by IMAP UID without marking it as read. Attachment size_bytes is the encoded MIME-part octet count reported by IMAP BODYSTRUCTURE; the size_bytes_basis value is bodystructure_octets. It may differ from the decoded byte count returned by Get Attachment, and reading this metadata does not fetch the attachment body. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Read a search result UID to extract its subject and attachment metadata before processing an invoice."
    operation_kind: source
    category: email
    connection_type_ids: [imap_mailbox]
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - {name: mailbox, value_type: text, required: true, description: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX."}
      - {name: uid, value_type: integer, required: true, description: "Positive numeric IMAP UID returned by Search IMAP messages, from the same mailbox."}
      - {name: include_body, value_type: boolean, required: false, description: "Include the message body in the result for downstream text processing."}
      - {name: include_headers, value_type: boolean, required: false, description: "Include the message headers in the result."}
      - {name: include_attachment_metadata, value_type: boolean, required: false, description: "Include attachment identifiers, filenames and content types so a later download step can select a file."}
      - {name: include_raw_html, value_type: boolean, required: false, description: "Include the original HTML body when HTML content is needed by a later step."}
    outputs: [{name: message, value_type: object}]
    result_fields: [result.message]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_not_found
      - message_not_found
      - message_too_large
      - message_too_complex
      - response_too_large
      - imap_command_failed
      - internal_error
  - operation_id: get_attachment
    display_name: "Download IMAP attachment"
    description: "Write one selected message attachment to an approved workflow artifact. Choose it by exactly one of attachment_id, filename or content_type; content_type accepts a wildcard such as image/*. A selector that matches nothing, or more than one attachment, fails and names what the message actually carries. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Download the invoice.pdf attachment using its attachment_id from message metadata and pass the artifact to document extraction."
    operation_kind: source
    category: email
    connection_type_ids: [imap_mailbox]
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - {name: mailbox, value_type: text, required: true, description: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX."}
      - {name: uid, value_type: integer, required: true, description: "Positive numeric IMAP UID returned by Search IMAP messages, from the same mailbox."}
      - {name: attachment_id, value_type: text, required: false, description: "Attachment identifier from Read IMAP message. At runtime, supply exactly one of attachment_id, filename or content_type."}
      - {name: filename, value_type: text, required: false, description: "Exact attachment filename. Use only this selector, attachment_id or content_type; multiple matches fail."}
      - {name: content_type, value_type: text, required: false, description: "Attachment MIME type or wildcard, such as application/pdf or image/*. It must identify exactly one attachment; use no other selector."}
    outputs:
      - {name: attachment_artifact_handle, value_type: artifact_handle}
      - {name: attachment_metadata, value_type: object}
      - name: attachment_presentation
        value_type: object
        schema:
          type: object
          additionalProperties: false
          required: [artifact_id, binding_key, filename, content_type, size_bytes, sha256]
          properties:
            artifact_id: {type: string, minLength: 1}
            binding_key: {type: string, const: attachment_artifact_handle}
            filename: {type: string, minLength: 1}
            content_type: {type: string, minLength: 1}
            size_bytes: {type: integer, minimum: 0}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    result_fields: [result.attachment_artifact_handle, result.attachment_metadata, result.attachment_presentation]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_not_found
      - message_not_found
      - message_too_large
      - message_too_complex
      - attachment_not_found
      - attachment_ambiguous
      - attachment_too_large
      - attachment_type_disallowed
      - artifact_output_unavailable
      - imap_command_failed
      - internal_error
  - operation_id: set_message_flags
    display_name: "Set IMAP read and starred flags"
    description: "Explicitly update Seen and Flagged state for selected message UIDs. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Set seen=true after an invoice has been processed; leave flagged empty to preserve its state."
    operation_kind: action
    category: email
    connection_type_ids: [imap_mailbox]
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - {name: mailbox, value_type: text, required: true, description: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX."}
      - {name: uids, value_type: array, required: true, description: "JSON array of positive IMAP UIDs from the selected source mailbox."}
      - {name: seen, value_type: boolean, required: false, description: "Set true to mark messages read or false to mark them unread. Leave empty to preserve read state; provide at least one of seen or flagged."}
      - {name: flagged, value_type: boolean, required: false, description: "Set true to star messages or false to remove the star. Leave empty to preserve starred state; provide at least one of seen or flagged."}
    outputs:
      - {name: results, value_type: array}
      - {name: external_effect_status, value_type: text}
      - {name: definitely_no_external_effect, value_type: boolean}
    result_fields: [result.results, result.external_effect_status, result.definitely_no_external_effect]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_not_found
      - timeout_unknown
      - imap_command_failed
      - internal_error
  - operation_id: move_messages
    display_name: "Move IMAP messages"
    description: "Explicitly move selected message UIDs between IMAP mailboxes. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Move processed UIDs from INBOX to an existing Processed folder after downstream work succeeds."
    operation_kind: action
    category: email
    connection_type_ids: [imap_mailbox]
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - {name: source_mailbox, value_type: text, required: true, description: "Existing mailbox containing the selected UIDs. UIDs are scoped to this mailbox."}
      - {name: target_mailbox, value_type: text, required: true, description: "Existing destination mailbox name returned by List IMAP mailboxes."}
      - {name: uids, value_type: array, required: true, description: "JSON array of positive IMAP UIDs from the selected source mailbox."}
    outputs:
      - {name: results, value_type: array}
      - {name: external_effect_status, value_type: text}
      - {name: definitely_no_external_effect, value_type: boolean}
      - {name: guidance, value_type: text}
    result_fields: [result.results, result.external_effect_status, result.definitely_no_external_effect, result.guidance]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_not_found
      - unsafe_expunge_unsupported
      - timeout_unknown
      - imap_command_failed
      - internal_error
  - operation_id: delete_messages
    display_name: "Delete or trash IMAP messages"
    description: "Explicitly move selected message UIDs to trash or permanently delete them with confirmation. Create an IMAP mailbox project connection with the server host, port, SSL or STARTTLS mode, username and password, then select it for this step. Example: Move duplicate messages to the configured trash folder with mode=move_to_trash; permanent deletion requires confirm_permanent_delete=true."
    operation_kind: action
    category: email
    connection_type_ids: [imap_mailbox]
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - {name: mailbox, value_type: text, required: true, description: "Exact mailbox name returned by List IMAP mailboxes, such as INBOX."}
      - {name: uids, value_type: array, required: true, description: "JSON array of positive IMAP UIDs from the selected source mailbox."}
      - {name: mode, value_type: text, required: false, description: "move_to_trash moves messages to the connection's trash folder. permanent deletes them and also requires confirm_permanent_delete=true."}
      - {name: confirm_permanent_delete, value_type: boolean, required: false, description: "Enable only with mode=permanent to confirm removal of the selected messages."}
    outputs:
      - {name: results, value_type: array}
      - {name: external_effect_status, value_type: text}
      - {name: definitely_no_external_effect, value_type: boolean}
      - {name: guidance, value_type: text}
    result_fields: [result.results, result.external_effect_status, result.definitely_no_external_effect, result.guidance]
    error_codes:
      - invalid_payload
      - invalid_connection
      - unsupported_provider
      - authentication_failed
      - network_blocked
      - connection_timeout
      - tls_verification_failed
      - connection_failed
      - mailbox_not_found
      - trash_mailbox_unavailable
      - unsafe_expunge_unsupported
      - timeout_unknown
      - imap_command_failed
      - internal_error
