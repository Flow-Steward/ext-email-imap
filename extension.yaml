manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.imap-mailbox
kind: tool_provider
version: 0.2.2
display_name: Generic IMAP Mailbox
description: |-
  Generic IMAP Mailbox brings email from Fastmail, Yahoo, Zoho, shared hosting and other compatible IMAP servers into Flow Steward workflows. List folders, search by sender, subject, date or read state, read selected messages and download their attachments for later steps. Reading a message leaves its read state unchanged, so your workflow can decide when processing is complete.

  Build invoice intake, document collection or mailbox triage workflows by passing attachments to document extraction or tabular processing. Once downstream work succeeds, update read or starred flags, move messages into a processed folder or send them to trash. Permanent deletion is available as a separate, explicitly confirmed operation where the server supports it.

  Create a project connection using the provider's IMAP host, port, SSL or STARTTLS mode, username and password or app password. Provider presets help with initial settings, and a connection test confirms access. This connector handles incoming mail; outbound messages use a separate email connection. Use dedicated connectors for Gmail and Microsoft mailboxes. Attachments support approved file types up to 20 MiB, and production connections require publicly reachable server addresses.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-email-imap/issues
  website_url: https://github.com/Flow-Steward/ext-email-imap
listing:
  category: messaging
  tags: [imap, email, mailbox]
  summary: |-
    Search generic IMAP mailboxes, read messages and attachments, then update flags, move messages or send them to trash.
  setup_summary: |-
    Create an imap_mailbox project connection with host, port, SSL or STARTTLS, username and a password or provider app password stored as a secret, then run Test Connection. Configure processed and trash folder names when your workflow moves or deletes messages.
features: [tool, action]
required_scopes: [extension:invoke, artifact:write]
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
  input:
    type: object
    properties:
      action: {type: string}
      request: {type: object}
    required: [action]
  output:
    type: object
    properties:
      ok: {type: boolean}
      result: {type: object}
      error_code: {type: string}
    required: [ok]
account_scope:
  scope_type: project
  description: IMAP mailbox connections and password secrets are scoped to each project.
external_effects:
  - operation_id: set_message_flags
    effect_kind: mailbox_message_update
    channel: imap
    idempotency: required
    test_mode_behavior: suppress
    observability:
      target_fields: [mailbox, uids]
      target_kind: mailbox_message
      target_label: mailbox UID
    rate_limit: {window_seconds: 60, account_max: 600, project_max: 300, connection_max: 120}
  - operation_id: move_messages
    effect_kind: mailbox_message_move
    channel: imap
    idempotency: required
    test_mode_behavior: suppress
    observability:
      target_fields: [source_mailbox, target_mailbox, uids]
      target_kind: mailbox_message
      target_label: mailbox UID
    rate_limit: {window_seconds: 60, account_max: 600, project_max: 300, connection_max: 120}
  - operation_id: delete_messages
    effect_kind: mailbox_message_delete
    channel: imap
    idempotency: required
    test_mode_behavior: suppress
    observability:
      target_fields: [mailbox, uids]
      target_kind: mailbox_message
      target_label: mailbox UID
    rate_limit: {window_seconds: 60, account_max: 600, project_max: 300, connection_max: 120}
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    resource_query_manifest: contracts/resource_query_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
  - operation_id: get_attachment
    outputs:
      - kind: artifact
        value_type: artifact_handle
        binding_key: attachment_artifact_handle
        filename: imap-attachment.bin
        content_type: application/octet-stream
        max_size_bytes: 20971520
        retention_class: run_window
entrypoint:
  mode: subprocess
  command: [python3, main.py]
health:
  command: [python3, health.py]
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements: []
